<!DOCTYPE html>

    <link rel="icon" type="image/png" href="/src/assets/logo.png">

    <!-- viewport-fit=cover : sans lui, l'encoche et la barre gestuelle des
         telephones recents reservent des bandes que la page ne peut pas
         peindre. Les retraits reels sont repris par env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="description" content="YOWL est une communauté où les 13-35 ans s'expriment librement sur les contenus découverts sur internet">
    <meta name="keywords" content="yowl, communauté, review, avis, commentaire, internet">
    <meta name="author" content="LONG Corp">
    <title>YOWL Community</title>

    <!-- Couleur de la barre d'etat une fois l'application lancee. Le manifeste
         en declare une autre, plus sombre : elle sert a l'ecran de demarrage,
         ou elle prolonge le fond sans couture. Ici on suit l'en-tete reel. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1e2a38" media="(prefers-color-scheme: dark)">

    <!-- iOS ignore le manifeste pour ces trois reglages. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="YOWL">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- ===================================================================
         ECRAN DE DEMARRAGE
         ===================================================================
         L'ecran que dessine le systeme au lancement d'une application
         installee est une image fixe : Android le compose a partir du
         manifeste, iOS a partir d'une image de demarrage, et ni l'un ni
         l'autre n'accepte d'animation. Ce qui suit prend le relais juste
         apres, pendant que le JavaScript demarre, et c'est la seule surface
         ou une animation est possible.

         Le fond reprend background_color du manifeste : la transition entre
         l'ecran du systeme et celui-ci ne se voit pas.

         Le balisage et le style vivent dans cette page plutot que dans un
         composant : un composant n'existe qu'une fois Vue demarre, c'est a
         dire precisement apres le moment que cet ecran doit couvrir. Le logo
         est integre en base64 pour la meme raison, aucun aller-retour reseau
         ne s'intercale avant le premier rendu. -->
    <style>
        #yowl-demarrage {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: grid;
            place-content: center;
            justify-items: center;
            gap: 1.75rem;
            background: #1e2a38;
            font-family: 'Poppins', system-ui, -apple-system, sans-serif;
            transition: opacity 420ms ease, visibility 420ms ease;
        }

        #yowl-demarrage[hidden] {
            display: none;
        }

        /* Retire par le script une fois l'application montee. La visibilite
           accompagne l'opacite, sinon l'ecran continue d'intercepter les
           touchers pendant toute la duree du fondu. */
        #yowl-demarrage.parti {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .yowl-demarrage-marque {
            width: 88px;
            height: 88px;
            border-radius: 26px;
            display: grid;
            place-items: center;
            background: linear-gradient(140deg, #ff8552, #cc4a15);
            box-shadow: 0 18px 45px -12px rgba(255, 107, 53, .55);
            animation: yowl-apparition 620ms cubic-bezier(.22, 1, .36, 1) both,
                       yowl-respiration 2.8s ease-in-out 620ms infinite;
        }

        .yowl-demarrage-marque img {
            width: 56px;
            height: 56px;
            object-fit: contain;
        }

        .yowl-demarrage-nom {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: .34em;
            /* La chasse s'ajoute apres chaque lettre, la derniere comprise :
               le bloc est plus large que les glyphes d'un espacement, et le
               mot parait decale a gauche. On rend la moitie de cet ecart. */
            text-indent: .17em;
            color: #ffffff;
            animation: yowl-montee 620ms cubic-bezier(.22, 1, .36, 1) 140ms both;
        }

        .yowl-demarrage-piste {
            width: 132px;
            height: 3px;
            border-radius: 999px;
            overflow: hidden;
            background: rgba(255, 255, 255, .14);
            animation: yowl-montee 620ms cubic-bezier(.22, 1, .36, 1) 260ms both;
        }

        .yowl-demarrage-piste::after {
            content: '';
            display: block;
            width: 45%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #ff8552, #ffb38a);
            animation: yowl-navette 1.25s cubic-bezier(.65, 0, .35, 1) infinite;
        }

        @keyframes yowl-apparition {
            from { opacity: 0; transform: scale(.82); }
            to   { opacity: 1; transform: scale(1); }
        }

        @keyframes yowl-respiration {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.045); }
        }

        @keyframes yowl-montee {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: none; }
        }

        @keyframes yowl-navette {
            0%   { transform: translateX(-100%); }
            100% { transform: translateX(322%); }
        }

        /* Un demarrage anime n'a pas a s'imposer a qui a demande le contraire
           dans les reglages de son systeme. L'ecran reste, immobile. */
        @media (prefers-reduced-motion: reduce) {
            #yowl-demarrage *,
            #yowl-demarrage *::after {
                animation: none !important;
            }
            #yowl-demarrage { transition: none; }
        }
    </style>
</head>
