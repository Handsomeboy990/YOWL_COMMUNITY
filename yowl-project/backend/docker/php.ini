; Les valeurs par defaut de PHP refusent un envoi de 25 Mo avant meme que la
; validation ne s'execute. Elles sont alignees sur ce que le controleur accepte
; reellement : cinq fichiers de 5 Mo.
upload_max_filesize = 8M
post_max_size = 32M
max_file_uploads = 10

memory_limit = 256M
max_execution_time = 60

expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
